    tags:
      - tag_id: "ch:1"
        label: "Chapter 1"
        aliases: ["Ch1", "Chapter One"]
  - category_id: workflow
    tags:
      - tag_id: method
        label: "Method"
        aliases: ["methodology", "workflow"]
      - tag_id: evidence
        label: "Evidence"
        aliases: ["source", "primary source"]
      - tag_id: synthesis
        label: "Synthesis"
        aliases: ["argument synthesis"]